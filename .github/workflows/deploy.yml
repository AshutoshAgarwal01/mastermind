name: Build and Deploy to Azure App Service

# CI (build/lint/E2E) runs automatically on every push to main.
# Deploying to Azure only happens when this workflow is triggered manually
# (Actions tab -> this workflow -> "Run workflow"), never on a plain push.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC login to Azure (azure/login@v2) — no stored long-lived
# secret needed, see docs/deployment.md "Deploy (GitHub Actions + OIDC)".
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # npm has a bug (npm/cli#4828) where a lockfile committed from one OS can be
        # missing another OS's platform-specific optional deps (here, Vite's rolldown
        # native binding for linux-x64). `npm install` alone still trusts the existing
        # lockfile's resolution, so the lockfile itself must be dropped to force a full
        # fresh resolve against this runner's actual platform.
        run: |
          rm -f package-lock.json
          npm install

      - name: Build (packages/shared -> apps/web -> apps/server)
        # Client Application Insights connection strings are not secret (same trust
        # model as a GA tracking ID) — Vite bakes VITE_ vars into the client bundle at
        # build time, so this is the only place to set it. Falls back to unset/no-op
        # telemetry on the client if the repo secret isn't configured.
        env:
          VITE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: npm run build

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Ships the whole repo exactly as built in this job. The App Service
      # must have SCM_DO_BUILD_DURING_DEPLOYMENT=false so Azure/Oryx does NOT
      # rebuild/recompress node_modules on its side: Oryx's node_modules
      # tar.gz compression relocates node_modules to /node_modules (outside
      # wwwroot), which breaks npm workspaces' relative symlink for
      # @mastermind/shared (../../packages/shared resolves to a path that no
      # longer exists once relocated). Shipping the already-built artifact
      # as-is keeps the workspace symlinks intact relative to their original
      # (untouched) directory layout. See docs/deployment.md.
      - name: Prune devDependencies for a leaner deploy package
        # typescript/vite/tsx/eslint/playwright etc. are only needed for the
        # steps above, not at runtime — pruning them cuts the zip size (and
        # container cold-start time) drastically.
        run: npm prune --omit=dev

      - name: Zip artifact
        run: zip -qr deploy.zip . -x '.git/*'

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip
          retention-days: 7

  deploy:
    needs: build
    # Only runs when this workflow is manually triggered — a plain push to
    # main builds/tests/lints (job above) but does NOT deploy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Uses `az webapp deploy --clean true` (not the azure/webapps-deploy
      # action) because that action's zip-deploy does NOT wipe wwwroot first —
      # a stale oryx-manifest.toml + compressed node_modules.tar.gz from an
      # earlier SCM_DO_BUILD_DURING_DEPLOYMENT=true deploy kept getting reused
      # by the container startup script even after switching it to false.
      # --clean true forces wwwroot to be wiped before extracting, so only
      # this job's freshly-built artifact is ever present.
      #
      # The App Service's Startup Command must be set to:
      #   node apps/server/dist/index.js
      - name: Deploy to Azure Web App (clean)
        run: |
          az webapp deploy --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --src-path deploy.zip --type zip --clean true --restart true

      - name: Azure logout
        if: always()
        run: az logout
