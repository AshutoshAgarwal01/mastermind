name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC login to Azure (azure/login@v2) — no stored long-lived
# secret needed, see docs/deployment.md "Deploy (GitHub Actions + OIDC)".
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (packages/shared -> apps/web -> apps/server)
        run: npm run build

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Ships the whole repo; Azure (Oryx) runs `npm install && npm run build`
      # again server-side because SCM_DO_BUILD_DURING_DEPLOYMENT=true must be
      # set on the App Service (see docs/deployment.md). This keeps the CI
      # build above as a fast fail-fast check (lint + E2E) without having to
      # hand-package the npm-workspaces monorepo's symlinked node_modules.
      #
      # The App Service's Startup Command must be set to:
      #   node apps/server/dist/index.js
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .

      - name: Azure logout
        if: always()
        run: az logout
